[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-agent"
version = "0.1.0"
description = "AI agent for orchestrating climate data processing workflows"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "xarray>=2024.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "netCDF4>=1.6",
    "dask>=2024.1",
    "h5netcdf>=1.3",
    "geopandas>=0.14",
    "rioxarray>=0.15",
    "pyproj>=3.6",
    "shapely>=2.0",
    "fiona>=1.9",
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "cdsapi>=0.6",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
climate-agent = "run_agent:main"

[project.urls]
Repository = "https://github.com/YonSci/climate-agent"
Dashboard = "https://yonsci.github.io/climate-agent/"
Issues = "https://github.com/YonSci/climate-agent/issues"
Discussions = "https://github.com/YonSci/climate-agent/discussions"
Documentation = "https://github.com/YonSci/climate-agent/wiki"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
