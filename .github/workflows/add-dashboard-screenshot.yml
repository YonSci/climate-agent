name: Add dashboard screenshot to README

on:
  push:
    branches:
      - agent/add-dashboard-screenshots
    paths:
      - docs/images/dashboard-overview.svg
      - .github/workflows/add-dashboard-screenshot.yml

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-dashboard-screenshots
          fetch-depth: 0

      - name: Insert dashboard preview
        shell: python
        run: |
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          heading = "### [Open the Climate Data Harmonization Dashboard](https://yonsci.github.io/climate-agent/)"
          preview = """### [Open the Climate Data Harmonization Dashboard](https://yonsci.github.io/climate-agent/)

          [![AI Climate Data Agent dashboard overview](docs/images/dashboard-overview.svg)](https://yonsci.github.io/climate-agent/)

          *Dashboard preview showing operational run statistics, supported coverage, climate variables, data sources, and quality-assurance information. Select the image to open the live dashboard.*"""

          if "docs/images/dashboard-overview.svg" not in text:
              if heading not in text:
                  raise SystemExit("Dashboard heading was not found in README.md")
              text = text.replace(heading, preview, 1)
              readme.write_text(text, encoding="utf-8")

      - name: Remove one-time helper workflow
        run: rm .github/workflows/add-dashboard-screenshot.yml

      - name: Commit README preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/add-dashboard-screenshot.yml
          if git diff --cached --quiet; then
            echo "No README update was required."
            exit 0
          fi
          git commit -m "Embed dashboard screenshot in README"
          git push origin HEAD:agent/add-dashboard-screenshots
