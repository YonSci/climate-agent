name: Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "runs/manifests/**"
      - "scripts/generate_report.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        run: |
          mkdir -p _site
          python scripts/generate_report.py --output _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - id: deployment
        uses: actions/deploy-pages@v4
