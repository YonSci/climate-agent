name: Feature request
description: Propose a new capability, workflow, country, variable, integration, or usability improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: user_need
    attributes:
      label: User need
      description: Describe the user, decision, modelling task, or Climate Data Hub requirement this feature would support.
      placeholder: As a climate analyst, I need ... so that ...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe the desired capability and how users would interact with it.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Main area
      options:
        - Data source or connector
        - Country or geography
        - Climate variable or indicator
        - Harmonization or regridding
        - Validation and quality assurance
        - Diagnostics and reporting
        - Climate Data Hub integration
        - Command-line usability
        - Documentation or training
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      description: List the evidence that would show the feature is complete and useful.
      placeholder: |
        - The workflow completes for ...
        - The output passes ...
        - Documentation and tests are included.
    validations:
      required: true

  - type: textarea
    id: stakeholders
    attributes:
      label: Stakeholders and geographies
      description: Identify intended users, partner institutions, countries, or programmes, where relevant.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds, related tools, or implementation options.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: The request does not include credentials, restricted data, or personal information.
          required: true
